
services:

  frontend:
    build:
      context: ./frontend
    container_name: feedback-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: feedback-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/feedback.json:/app/app/feedback.json
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
